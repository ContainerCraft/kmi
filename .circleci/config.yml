version: "2.1"
orbs:
  slack: circleci/slack@4.5.0

aliases:
  almalinux-flavors: &_almalinux-flavors
    - almalinux-10

  archlinux-flavors: &_archlinux-flavors
    - archlinux-latest

  centos-flavors: &_centos-flavors
    - centos-10

  debian-flavors: &_debian-flavors
    - debian-13

  fcos-flavors: &_fcos-flavors
    - fcos-42

  fedora-flavors: &_fedora-flavors
    - fedora-42

  freebsd-flavors: &_freebsd-flavors
    - freebsd-15

  opensuse-tumbleweed-flavors: &_opensuse-tumbleweed-flavors
    - opensuse-tumbleweed

  opensuse-leap-flavors: &_opensuse-leap-flavors
    - opensuse-leap-16

  openwrt-flavors: &_openwrt-flavors
    - openwrt-24

  rocky-flavors: &_rocky-flavors
    - rocky-10

  ubuntu-flavors: &_ubuntu-flavors
    - ubuntu-24-04

  vyos-flavors: &_vyos-flavors
    - vyos-rolling

  talos-flavors: &_talos-flavors
    - talos-1-11

  kali-flavors: &_kali-flavors
    - kali-linux

  cache-key: &_cache-key
    key: << parameters.flavor >>-<< parameters.arch >>-{{ checksum "hack/customize.sh" }}-{{ checksum "images/<< parameters.flavor >>/env.sh" }}

#################################################################################
# Job Scheduler
workflows:
  build-and-publish-dev:
    jobs:
      # Start Arch Linux #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
          matrix:
            parameters:
              flavor: *_archlinux-flavors
              arch: [amd64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
          name: cradle-<< matrix.flavor >>
          matrix:
            parameters:
              flavor: *_archlinux-flavors

      - trigger-tests:
          requires:
            - cradle-<< matrix.flavor >>
          name: trigger-<< matrix.flavor >>-promotion
          matrix:
            parameters:
              flavor: *_archlinux-flavors
      # End ArchLinux #

      # Start Rocky #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
          matrix:
            parameters:
              flavor: *_rocky-flavors
              arch: [amd64, arm64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
            - customize-<< matrix.flavor >>-arm64
          name: cradle-<< matrix.flavor >>
          matrix:
            parameters:
              flavor: *_rocky-flavors

      - trigger-tests:
          requires:
            - cradle-<< matrix.flavor >>
          name: trigger-<< matrix.flavor >>-promotion
          matrix:
            parameters:
              flavor: *_rocky-flavors
      # End Rocky #

      # Start AlmaLinux #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
          matrix:
            parameters:
              flavor: *_almalinux-flavors
              arch: [amd64, arm64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
            - customize-<< matrix.flavor >>-arm64
          name: cradle-<< matrix.flavor >>
          matrix:
            parameters:
              flavor: *_almalinux-flavors

      - trigger-tests:
          requires:
            - cradle-<< matrix.flavor >>
          name: trigger-<< matrix.flavor >>-promotion
          matrix:
            parameters:
              flavor: *_almalinux-flavors
      # End AlmaLinux #

      # Start CentOS #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
          matrix:
            parameters:
              flavor: *_centos-flavors
              arch: [amd64, arm64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
            - customize-<< matrix.flavor >>-arm64
          name: cradle-<< matrix.flavor >>
          matrix:
            parameters:
              flavor: *_centos-flavors

      - trigger-tests:
          requires:
            - cradle-<< matrix.flavor >>
          name: trigger-<< matrix.flavor >>-promotion
          matrix:
            parameters:
              flavor: *_centos-flavors
      # End CentOS #

      # Start Fedora #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
          matrix:
            parameters:
              flavor: *_fedora-flavors
              arch: [amd64, arm64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
            - customize-<< matrix.flavor >>-arm64
          name: cradle-<< matrix.flavor >>
          matrix:
            parameters:
              flavor: *_fedora-flavors

      - trigger-tests:
          requires:
            - cradle-<< matrix.flavor >>
          name: trigger-<< matrix.flavor >>-promotion
          matrix:
            parameters:
              flavor: *_fedora-flavors
      # End Fedora #

      # Start Ubuntu #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
          matrix:
            parameters:
              flavor: *_ubuntu-flavors
              arch: [amd64, arm64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
            - customize-<< matrix.flavor >>-arm64
          name: cradle-<< matrix.flavor >>
          matrix:
            parameters:
              flavor: *_ubuntu-flavors

      - trigger-tests:
          requires:
            - cradle-<< matrix.flavor >>
          name: trigger-<< matrix.flavor >>-promotion
          matrix:
            parameters:
              flavor: *_ubuntu-flavors
      # End Ubuntu #

      # Start Debian #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
          matrix:
            parameters:
              flavor: *_debian-flavors
              arch: [amd64, arm64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
            - customize-<< matrix.flavor >>-arm64
          name: cradle-<< matrix.flavor >>
          matrix:
            parameters:
              flavor: *_debian-flavors

      - trigger-tests:
          requires:
            - cradle-<< matrix.flavor >>
          name: trigger-<< matrix.flavor >>-promotion
          matrix:
            parameters:
              flavor: *_debian-flavors
      # End Debian #

      # Start openSUSE Tumbleweed #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
          matrix:
            parameters:
              flavor: *_opensuse-tumbleweed-flavors
              arch: [amd64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
          name: cradle-<< matrix.flavor >>
          matrix:
            parameters:
