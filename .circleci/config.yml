      - trigger-tests:
          requires:
            - cradle-<< matrix.flavor >>
          name: trigger-<< matrix.flavor >>-promotion
          matrix:
            parameters:
              flavor: *_opensuse-tumbleweed-flavors
      # End openSUSE Tumbleweed #

      # Start openSUSE Leap #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
