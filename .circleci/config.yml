              arch: [amd64, arm64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
            - customize-<< matrix.flavor >>-arm64
          name: cradle-<< matrix.flavor >>
          matrix:
            parameters:
              flavor: *_opensuse-leap-flavors

      - trigger-tests:
          requires:
            - cradle-<< matrix.flavor >>
          name: trigger-<< matrix.flavor >>-promotion
          matrix:
            parameters:
              flavor: *_opensuse-leap-flavors
      # End openSUSE Leap #

      # Start OpenWrt #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
          matrix:
            parameters:
              flavor: *_openwrt-flavors
              arch: [amd64, arm64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
            - customize-<< matrix.flavor >>-arm64
          name: cradle-<< matrix.flavor >>
          matrix:
            parameters:
              flavor: *_openwrt-flavors

      - trigger-tests:
          requires:
            - cradle-<< matrix.flavor >>
          name: trigger-<< matrix.flavor >>-promotion
          matrix:
            parameters:
              flavor: *_openwrt-flavors
      # End OpenWrt #

      # Start FCOS #
      - customize:
          name: customize-<< matrix.flavor >>-<< matrix.arch >>
          matrix:
            parameters:
              flavor: *_fcos-flavors
              arch: [amd64, arm64]

      - cradle:
          requires:
            - customize-<< matrix.flavor >>-amd64
            - customize-<< matrix.flavor >>-arm64
