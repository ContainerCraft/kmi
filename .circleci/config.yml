      # End Kali Linux #

#################################################################################
# Reuseable Jobs
jobs:
  # Download & Prepare qcow2 image(s)
  customize:
    parameters:
      flavor:
        type: string
      arch:
        type: string
    executor: << parameters.arch >>
    environment:
      DEBIAN_FRONTEND: noninteractive
      FLAVOR: << parameters.flavor >>
      ARCH: << parameters.arch >>
    steps:
      - checkout-https
      - halt-if-no-changes:
          flavor: << parameters.flavor >>
      - prepare-qcow2:
          flavor: << parameters.flavor >>
          arch: << parameters.arch >>
      - ops-notify-err

  # Containerize qcow2 image(s)
  cradle:
    parameters:
      flavor:
        type: string
    executor: amd64
    environment:
      FLAVOR: << parameters.flavor >>
    steps:
      - checkout-https
      - halt-if-no-changes:
          flavor: << parameters.flavor >>
      - cradle-qcow2:
          flavor: << parameters.flavor >>
      - ops-notify-err

  trigger-tests:
    executor: amd64
    parameters:
      flavor:
        type: string
    steps:
      - checkout-https
      - halt-if-no-changes:
          flavor: << parameters.flavor >>
      - trigger-gha-test:
          flavor: << parameters.flavor >>
      - ops-notify-err

#################################################################################
# Reuseable Commands
commands:
  checkout-https:
    description: "Checkout code via HTTPS (recommended for public repos)"
    steps:
      - run:
          name: Checkout code via HTTPS
          command: |
            set -ex
            # Clone the repository using HTTPS instead of SSH
            git clone --depth=1 https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git .
            # Checkout the specific branch/commit
            git fetch --depth=1 origin ${CIRCLE_SHA1}
            git checkout ${CIRCLE_SHA1}

  halt-if-no-changes:
    description: "Halt the build if nothing has changed from origin/HEAD"
    parameters:
      flavor:
        type: string
    steps:
      - run:
          name: Halt if needed
          command: |
            set -x
            # if we aren't on the ccio branch and there are no files changes
            # from the ccio branch, halt. Else if the file has not changed in
            # the last commit, halt.
            if [[ "$CIRCLE_BRANCH" != "ccio" ]]; then
              if git diff --quiet HEAD $(git rev-parse origin/HEAD) -- images/<< parameters.flavor >>/ ; then
                circleci-agent step halt
              fi
            elif git diff --quiet HEAD $(git rev-parse origin/HEAD)~1 -- images/<< parameters.flavor >>/ ; then
              echo "No Change Detected"
              # circleci-agent step halt
            fi

  trigger-gha-test:
    description: "Tests: Trigger GHA Test Workflow"
    parameters:
      flavor:
        type: string
    steps:
      - run:
          name: Trigger GitHub Actions E2E test and promote workflow
          command: |
            set -x
            curl \
              --fail \
              --request POST \
              --header "Authorization: token $GITHUB_ACTIONS_PAT" \
              --header "Accept: application/vnd.github.everest-preview+json" \
              --data-raw '{"ref":"<< pipeline.git.branch >>", "inputs": {"flavor": "<< parameters.flavor >>"}' \
              https://api.github.com/repos/containercraft/kmi/actions/workflows/test.yml/dispatches

  buildx-bake:
    description: "Runner: Execute Docker Buildx"
    parameters:
      bake_file:
        type: string
        default: bake.hcl
      target:
        type: string
    steps:
      - run:
          command: |
            docker buildx bake \
              -f << parameters.bake_file >> \
              --push \
              --progress plain \
              << parameters.target >>

  # CMD: Configure Docker BuildX
  enable-buildx:
    description: "Runner: Configure Docker Buildx Environment"
    parameters:
      buildkit_version:
        type: string
        default: latest
    steps:
      - run:
          name: Install All Emulators
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install arm64
      - run:
          name: Create builder with buildkit << parameters.buildkit_version >>
          command: |
            docker buildx ls \
              | grep "build-<< parameters.buildkit_version >>" \
              || docker buildx create --use \
              --name build-<< parameters.buildkit_version >> \
              --driver docker-container \
              --driver-opt image=moby/buildkit:<< parameters.buildkit_version >>,network=host
      - run:
          name: Set builder
          command: docker buildx use --default build-<< parameters.buildkit_version >>
      - run:
          name: Start up buildx and inspect
          command: docker buildx inspect --bootstrap
      - run:
          name: Login to dockerhub
          command: echo ${DOCKERHUB_PASSWORD} | docker login -u ${DOCKERHUB_USERNAME} --password-stdin
      - ops-notify-err

  prepare-qcow2:
    description: "Qcow2 Image: Download and Customize"
    parameters:
      flavor:
        type: string
      arch:
        type: string
    steps:
      - restore_cache:
          <<: *_cache-key

      - run:
          name: Customize image
          no_output_timeout: 90m
          command: |

            # Check for && confirm cached customized image present || If not
            # present then customize and cache
            if [[ ! -f ${FLAVOR}-${ARCH}.qcow2 ]]; then
              set -ex

              sudo apt-get update
              sudo apt-get upgrade -y
              sudo apt-get dist-upgrade -y
              sudo apt-get install -y \
                curl qemu-user libguestfs-tools qemu-user-static gzip p7zip-full

              # Fix DNS resolution for virt-sysprep on Ubuntu 24.04
              # systemd-resolved uses /etc/resolv.conf -> /run/systemd/resolve/stub-resolv.conf
              # but virt-sysprep needs a real resolv.conf with nameservers
              # Get DNS servers from systemd-resolved and create traditional resolv.conf
              if [[ ! -f /etc/resolv.conf ]] || [[ -L /etc/resolv.conf ]]; then
                echo "Creating /etc/resolv.conf for virt-sysprep DNS resolution"
                # Extract DNS servers from systemd-resolved
                DNS_SERVERS=$(resolvectl status --no-pager | grep 'DNS Servers:' | head -n1 | awk '{print $3}')
                if [[ -z "${DNS_SERVERS}" ]]; then
                  # Fallback to common public DNS if no DNS servers found
                  DNS_SERVERS="1.1.1.1"
                  echo "Warning: No DNS servers found, using fallback: ${DNS_SERVERS}"
                fi
                # Backup existing resolv.conf if it's a symlink
                if [[ -L /etc/resolv.conf ]]; then
                  sudo mv /etc/resolv.conf /etc/resolv.conf.backup
                fi
                # Create traditional resolv.conf with discovered DNS servers
                echo "nameserver ${DNS_SERVERS}" | sudo tee /etc/resolv.conf
                echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
                echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
                sudo chmod 644 /etc/resolv.conf
                echo "Created /etc/resolv.conf with nameservers: ${DNS_SERVERS}, 1.1.1.1, 8.8.8.8"
              fi

              bash hack/customize.sh ${FLAVOR} ${ARCH}
            else
              echo "Detected cached disk image ... continuing"
            fi

      - save_cache:
          <<: *_cache-key
          paths:
            - << parameters.flavor >>-<< parameters.arch >>.qcow2

      - persist_to_workspace:
          root: /home/circleci/project
          paths:
            - << parameters.flavor >>-<< parameters.arch >>.qcow2

  cradle-qcow2:
    description: "Qcow2 Image: Download and Customize"
    parameters:
      flavor:
        type: string
    steps:
      - attach_workspace:
          at: /home/circleci/project/images

      - run:
          command: ls -lah images/

      - enable-buildx
      - buildx-bake:
          target: << parameters.flavor >>

  # CMD: Slack Notify if ERR
  ops-notify-err:
    description: Alert Ops if Abort Failures Occur
    steps:
      - slack/notify:
          event: fail
          channel: ops-kargo
          template: basic_fail_1

#################################################################################
# Workflow Runner Instances
# CircleCI Machine Image List:
#   - https://circleci.com/docs/2.0/configuration-reference/#available-machine-images
#   - https://circleci.com/developer/images?imageType=machine
executors:
  # ARM64 Runner
  arm64:
    machine:
      enabled: true
      image: ubuntu-2204:2025.09.1
    environment:
      DOCKER_CLI_EXPERIMENTAL: enabled
    resource_class: arm.xlarge # 8 vCPUs, 32GB RAM

  # AMD64 Runner
  amd64:
    machine:
      enabled: true
      image: ubuntu-2204:2025.09.1
    environment:
      DOCKER_CLI_EXPERIMENTAL: enabled
    resource_class: xlarge # 8 vCPUs, 32GB RAM
