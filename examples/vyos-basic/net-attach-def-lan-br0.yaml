---
# NetworkAttachmentDefinition for LAN/downstream bridge (br0)
# Used by VyOS eth1 interface for downstream connectivity
# No IPAM - VyOS will handle IP addressing and DHCP server
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan-br0
  namespace: default
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "br0",
      "promiscMode": true
    }'