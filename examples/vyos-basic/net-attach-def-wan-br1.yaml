---
# NetworkAttachmentDefinition for WAN/upstream bridge (br1)
# Used by VyOS eth0 interface for upstream connectivity
# No IPAM - VyOS will handle IP addressing via DHCP
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: wan-br1
  namespace: default
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "br1",
      "promiscMode": true
    }'